[package]
name = "gitteam"
version = "0.1.0"
description = "AI-optimized ticket manager with Git sync"
authors = ["GitTeam"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitteam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
gray_matter = "0.2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
# Already in the dependency graph via tauri; promoted to a direct dependency
# for OS entropy behind ticket ULIDs. No new crate is downloaded.
getrandom = "0.3"
keyring = { version = "3", features = ["linux-native", "apple-native", "windows-native"] }
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "time"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
